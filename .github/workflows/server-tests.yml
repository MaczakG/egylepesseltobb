name: Server tests

on:
  push:
    paths:
      - server/**
      - index.html
      - .github/workflows/server-tests.yml
  pull_request:
    paths:
      - server/**
      - index.html
      - .github/workflows/server-tests.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
