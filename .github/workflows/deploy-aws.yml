name: Deploy AWS

# Létrehozza (vagy törli) az AWS szervert. Az oldal tartalmát maga a szerver húzza le
# 5 percenként a repó alapértelmezett ágáról, ahhoz nem kell újra futtatni.
on:
  push:
    paths:
      - deploy/aws/**
      - .github/workflows/deploy-aws.yml
  workflow_dispatch:
    inputs:
      action:
        description: Művelet
        type: choice
        options: [deploy, destroy]
        default: deploy
      domain:
        description: Saját domain(ek), vesszővel elválasztva (üresen ideiglenes sslip.io domain)
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  aws:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        if: inputs.action != 'destroy'
        env:
          DOMAIN: ${{ inputs.domain }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: deploy/aws/deploy.sh

      - name: Destroy
        if: inputs.action == 'destroy'
        env:
          FORCE: "1"
        run: deploy/aws/destroy.sh
